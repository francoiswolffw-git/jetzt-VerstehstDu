<script>
(function(){
'use strict';
/* ═══════════════════════════ Konfiguration ═══════════════════════════ */
const CFG_KEY='vd_config_v1', STATE_KEY='vd_state_v1';
const DEFAULT_CFG={zweiterVersuch:false, customer:'Musterbetrieb', mail:'francoiswolf.fw@googlemail.com', endpoint:'https://script.google.com/macros/s/AKfycbwQW-0Nq9Nn2EeWWpenpO7QMtRyMKa60Qg_MEe45-R4Dytt_2gLVnxjrud06Yi2FvIm1g/exec', demoBilder:true, responsible:'', videoBase:'videos', langs:['de','en','fr','da'], module:'BA09', avatarNote:true};
let cfg=loadJSON(CFG_KEY,{});
cfg=Object.assign({},DEFAULT_CFG,cfg);
/* URL-Parameter (z. B. per QR-Code): ?kunde=Firma&mail=arbeitsschutz@firma.de&lang=de&video=https://… */
const qp=new URLSearchParams(location.search);
/* ── Zustellung des Nachweises ────────────────────────────────────────
   Der Nachweis geht selbsttaetig an den eingerichteten Endpunkt. Klappt das nicht,
   bleibt er in der Warteschlange und geht los, sobald wieder Netz da ist.
   Geloescht wird erst, was zugestellt wurde. */
const QUEUE_KEY='vd_queue_v1';
const queueLesen=()=>loadJSON(QUEUE_KEY,[]);
const queueSchreiben=q=>{try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}catch(e){}};
async function anEndpunkt(rec){
  /* text/plain vermeidet die Vorabanfrage, damit auch ein Google-Apps-Script-Endpunkt annimmt. */
  const res=await fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return true;
}
function zugestellt(id){
  if(S.proof&&S.proof.id===id&&!S.proof.deliveredAt){S.proof.deliveredAt=new Date().toISOString();save();}
}
async function queueSenden(){
  const q=queueLesen();
  if(!q.length||!cfg.endpoint||!navigator.onLine) return {offen:q.length,gesendet:0};
  const rest=[];let gesendet=0;
  for(const e of q){
    try{await anEndpunkt(e.rec);zugestellt(e.rec.id);gesendet++;}
    catch(err){e.versuche=(e.versuche||0)+1;e.letzterFehler=String(err&&err.message||err);e.zuletzt=new Date().toISOString();rest.push(e);}
  }
  queueSchreiben(rest);
  return {offen:rest.length,gesendet};
}
async function nachweisZustellen(){
  const r=S.proof;
  if(!r||r.deliveredAt||!cfg.endpoint) return;
  try{await anEndpunkt(r);r.deliveredAt=new Date().toISOString();save();}
  catch(e){
    const q=queueLesen();
    if(!q.some(x=>x.rec&&x.rec.id===r.id)){q.push({rec:r,versuche:1,letzterFehler:String(e&&e.message||e),zuletzt:new Date().toISOString()});queueSchreiben(q);}
  }
  render();
}
window.addEventListener('online',()=>{queueSenden().then(res=>{if(res&&res.gesendet)render();});});

/* Alle hinterlegten Unterweisungen. Ein weiteres Modul heißt: Datei einbinden, fertig. */
const MODULES=window.VD_MODULES||{};
const MOD_IDS=Object.keys(MODULES);
/* Sprachen über alle Module hinweg, damit die Sprachwahl vor der Modulwahl stehen kann */
const LANGS={};
for(const id of MOD_IDS) for(const [k,l] of Object.entries(MODULES[id].languages||{})) if(!LANGS[k]) LANGS[k]=l;
let MOD=null, SEG_TOTAL=0, SEG_COUNT=0;
function setModule(id){ MOD=MODULES[id]||null; SEG_TOTAL=MOD?(MOD.languages.de||Object.values(MOD.languages)[0]).segments.length:0; SEG_COUNT=Math.max(0,SEG_TOTAL-1); }
const modLangs=m=>Object.keys(m.languages||{});
const modTitle=(m,lang)=>((m.languages[lang]||{}).title)||m.titleDE;
const APP_VERSION='2.3.0';
/* Ein Gerät mit gesetzter PIN nimmt keine Einrichtung mehr über die URL an. Sonst könnte ein fremder QR-Code das Zielpostfach umleiten. */
if(!cfg.pinHash){
  if(qp.get('kunde')) cfg.customer=qp.get('kunde');
  if(qp.get('mail')) cfg.mail=qp.get('mail');
  if(qp.get('video')) cfg.videoBase=qp.get('video');
  if(qp.get('langs')) cfg.langs=qp.get('langs').split(',').map(s=>s.trim()).filter(k=>LANGS[k]);
  if(!cfg.langs.length) cfg.langs=['de'];
  if(['kunde','mail','video','langs'].some(k=>qp.has(k))) saveJSON(CFG_KEY,cfg);
}

/* ═══════════════════════════ Zustand ════════════════════════════════ */
const fresh=()=>({screen:'lang',lang:null,module:null,person:null,segIdx:0,seen:{},questions:[],quiz:null,startedAt:null,proof:null,repeatList:null,doneModules:{}});
let S=Object.assign(fresh(),loadJSON(STATE_KEY,{}));
/* Personendaten verfallen von selbst: 60 Minuten ohne Aktivität, fertige Nachweise nach 30 Minuten. Geteilte Geräte zeigen so keine fremden Daten. */
const RESUME_MS=60*60*1000, PROOF_MS=30*60*1000;
if(S.updatedAt && (Date.now()-S.updatedAt > (S.proof?PROOF_MS:RESUME_MS))) S=fresh();
if(qp.get('lang') && LANGS[qp.get('lang')] && !S.person){S.lang=qp.get('lang');}
if(S.lang && !LANGS[S.lang]) S=fresh();
if(S.module && MODULES[S.module]) setModule(S.module); else if(MOD_IDS.length===1) setModule(MOD_IDS[0]);
if(location.hash==='#setup') S.screen=cfg.pinHash?S.screen:'setup';
if(location.hash==='#setup' && cfg.pinHash) setTimeout(()=>checkPin().then(ok=>{if(ok)go('setup');else toast('PIN stimmt leider nicht.');}),300);
if(location.hash==='#neu'){S=fresh();history.replaceState(null,'',location.pathname+location.search);}

function save(){S.updatedAt=Date.now();saveJSON(STATE_KEY,S);}
/* Ein neues Modul beginnt: Fortschritt zurücksetzen, Person und erledigte Module bleiben */

/* ── 3 Auswahl der Unterweisung ───────────────────────────────────────── */
function vModules(main){
  const offen=MOD_IDS.filter(id=>!(S.doneModules||{})[id]).length;
  const list=el('div',{class:'mod-list'});
  MOD_IDS.forEach((id,n)=>{
    const m=MODULES[id];
    const da=modLangs(m).includes(S.lang);
    const fertig=(S.doneModules||{})[id];
    const laufend=S.module===id&&!S.proof&&Object.keys(S.seen||{}).length>0;
    list.append(el('button',{class:'mod-btn'+(fertig?' done':'')+(da?'':' off'),disabled:!da,
      onclick:()=>{ if(!da)return;
        if(laufend){setModule(id);go('seg');} else {startModule(id);go('seg');} }},
      el('span',{class:'mod-state'},fertig?'✓':(laufend?'…':String(n+1))),
      el('span',{class:'mod-txt'},
        el('b',{},da?modTitle(m,S.lang):m.titleDE),
        el('span',{class:'mod-sub'},`${m.id} · ${m.version}`+(fertig?' · '+T('modDone'):(laufend?' · '+T('modOpen'):''))+(da?'':' · '+T('modNoLang')))),
      da?el('span',{class:'mod-go',html:ICON.next}):null));
  });
  main.append(el('div',{class:'card stack'},
    el('h1',{},T('modTitle')),
    el('p',{class:'muted'},T('modIntro',{n:MOD_IDS.length,offen:offen})),
    list,
    el('div',{class:'row between',style:'margin-top:4px'},
      el('button',{class:'btn ghost',onclick:()=>go('lang')},el('span',{html:ICON.back}),T('back')),

/* ── 3 Abschnitte ────────────────────────────────────────────────────── */
function vSeg(main){
  const segs=L().segments, i=S.segIdx, seg=segs[i];
  let built=false, curVideo=null, renderPending=false;
  /* Neu zeichnen erst nach dem Ende des Videos, sonst bricht der Ton bei 90 Prozent ab. */
  const markSeen=()=>{if(S.seen[seg.id])return;S.seen[seg.id]=true;save();if(!built||!topics.isConnected)return;if(curVideo&&!curVideo.paused&&!curVideo.ended){renderPending=true;}else render();};
  /* Themenleiste: aktuelles Thema wandert mit */
  const topics=el('div',{class:'topics',role:'tablist'});
  segs.forEach((s,idx)=>{const c=el('button',{class:'chip'+(idx===i?' active':S.seen[s.id]?' seen':' todo')+(S.repeatList&&S.repeatList.includes(s.id)?' accent':''),role:'tab','aria-selected':idx===i,onclick:()=>go('seg',{segIdx:idx})},idx>0?el('span',{class:'n'},String(idx)):null,s.short);topics.append(c);});
  const prog=el('div',{class:'progress'},el('div',{style:`width:${Math.round((Object.keys(S.seen).length)/SEG_TOTAL*100)}%`}));
  /* Bühne: links Sprecher, rechts Bild oder Merkpunkte */
  const media=el('div',{class:'media'});
  const renderCard=(box,sg,idx)=>{box.classList.remove('has-video');box.replaceChildren(el('div',{class:'num'},el('b',{},sg.id),idx===0?T('intro'):T('segmentOf',{n:idx,total:SEG_COUNT})),el('h2',{},sg.title),el('ul',{},sg.sub.map(x=>el('li',{},x))));};
  const vKey=`${MOD.id}_${seg.id}_${S.lang.toUpperCase()}`;
  const videoUrl=(window.VD_VIDEOS&&window.VD_VIDEOS[vKey]) ? window.VD_VIDEOS[vKey]
                : (cfg.videoBase&&L().hasVideo) ? `${cfg.videoBase.replace(/\/$/,'')}/${vKey}.mp4` : null;
  const imgs=(MOD.images&&MOD.images[seg.id])||[];
  let hasVideo=false, stage=null;
  if(videoUrl){
    const v=el('video',{playsinline:true,preload:'metadata',src:videoUrl});curVideo=v;
    /* Rechte Fläche: Bilder wechseln im Takt des Videos, sonst stehen dort die Merkpunkte. */
    const info=el('div',{class:'stage-info'});
    let shots=[], keinBild=false;
    if(imgs.length){
      shots=imgs.map((im,n)=>el('figure',{class:'shot'+(n===0?' on':'')},
        el('img',{src:(window.VD_IMAGES&&window.VD_IMAGES[im.file])||'bilder/'+im.file,alt:T(im.cap),loading:n===0?'eager':'lazy'}),
        el('figcaption',{},T(im.cap))));
      info.classList.add('shots');info.append(...shots);
      if(cfg.demoBilder!==false) info.append(el('div',{class:'demo-band'},el('b',{},T('demoImages'))));
    } else {
      info.classList.add('points'); keinBild=true;
      info.append(el('div',{class:'num'},seg.id===segs[0].id?T('intro'):T('segmentOf',{n:i,total:SEG_COUNT})),
                  el('h3',{},seg.title), el('ul',{},seg.sub.map(x=>el('li',{},x))));
    }
    v.addEventListener('error',()=>{hasVideo=false;
      S.videoFail=S.videoFail||{};S.videoFail[seg.id]=true;save();
      stage.replaceChildren(el('div',{class:'videofehler'},el('b',{},T('videoMissing')),el('p',{},T('videoMissingHint'))));
      if(stage.vbar)stage.vbar.remove();
      renderCard(media,seg,i);
      /* Ohne Video zaehlt der gelesene Text. Freigabe erst nach einer Mindestlesezeit. */
      const woerter=(seg.text||'').split(/\s+/).length;
      setTimeout(markSeen, Math.max(10, woerter/2.5)*1000);
      toast(T('videoMissing'));});
    /* Als gesehen zaehlt nur, was wirklich gelaufen ist. Vorspulen bringt keinen Fortschritt. */

    v.addEventListener('timeupdate',()=>{
      const d=v.currentTime-letzteZeit;

      if(shots.length>1&&v.duration){const n=Math.min(shots.length-1,Math.floor(v.currentTime/v.duration*shots.length));

    const av=el('div',{class:'stage-av'},v,cfg.avatarNote?el('span',{class:'avatar-note'},'KI-Avatar'):null);

    backBtn.onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);};
    again.onclick=()=>{v.currentTime=0;v.play();};
    track.onclick=e=>{const r=track.getBoundingClientRect();if(!v.duration)return;

  } else {renderCard(media,seg,i);media.append(el('div',{style:'margin-top:12px;color:var(--accent);font-size:13px;font-weight:600'},({en:'Avatar video in this language: available in the pilot',fr:'Vidéo avec avatar dans cette langue : disponible dans le pilote'})[S.lang]||'Video mit Avatar in dieser Sprache: im Pilot'));markSeen();}

  /* Frage sprechen statt tippen. Nutzt die Spracherkennung des Geräts. */

  let rec=null, laeuft=false;
  const micBtn=el('button',{class:'btn secondary mic',onclick:()=>{
    if(!SR){toast(T('micNone'));return;}
    if(laeuft){rec&&rec.stop();return;}
    try{
      rec=new SR(); rec.lang=L().code; rec.interimResults=true; rec.continuous=false;
      let fest=ta.value?ta.value.trim()+' ':'';
      rec.onstart=()=>{laeuft=true;micBtn.classList.add('on');micBtn.replaceChildren(el('span',{html:ICON.micOn}),T('micStop'));micHint.hidden=false;};
      rec.onresult=e=>{let vorl='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fest+=t+' ';else vorl+=t;}ta.value=(fest+vorl).replace(/\s+/g,' ').trim();};
      rec.onerror=e=>{toast(e.error==='not-allowed'?T('micDenied'):T('micError'));};
      rec.onend=()=>{laeuft=false;micBtn.classList.remove('on');micBtn.replaceChildren(el('span',{html:ICON.mic}),T('micStart'));micHint.hidden=true;ta.focus();};

    el('div',{class:'row',style:'margin-top:10px'},
      el('button',{class:'btn qsave',onclick:()=>{const t=ta.value.trim();if(!t)return;
        S.questions.push({seg:seg.id,text:t,kind:qKind,at:new Date().toISOString()});save();
        ta.value='';qBox.hidden=true;

/* ── 4 Wissenscheck ──────────────────────────────────────────────────── */
function newQuiz(){
  /* Nach einer Nachschulung werden genau die Fragen erneut gestellt, die falsch waren. */
  if(S.retryGroups&&S.retryGroups.length){const g=S.retryGroups.slice();
    return {order:g,queue:g,pos:0,asked:[],correct:0,done:false,passed:false,retry:true};}
  const groups=shuffle(Object.keys(L().questions));
  const queue=groups.slice(0,5);
  S.quizTotal=queue.length; S.correctGroups=[];
  return {order:groups,queue:queue,pos:0,asked:[],correct:0,done:false,passed:false};
}
function currentQuestion(){
  const q=S.quiz;const g=q.queue[q.pos];if(!g)return null;
  if(!q.asked[q.pos]){const variants=L().questions[g];
    /* In der Nachschulungsrunde kommt eine andere Variante, damit der Antwortbildschirm nicht auswendig gelernt wird. */
    const frisch=variants.filter(v=>!(S.askedIds||[]).includes(v.id));
    const pool=frisch.length?frisch:variants;
    const v=pool[Math.floor(Math.random()*pool.length)];
    S.askedIds=(S.askedIds||[]).concat(v.id);
    q.asked[q.pos]={group:g,id:v.id,order:shuffle([0,1,2]),chosen:null,correct:null};save();}
  const a=q.asked[q.pos];const def=L().questions[g].find(v=>v.id===a.id);return {a,def};
}
function vQuiz(main){
  if(S.repeatList&&S.repeatList.length&&S.quiz===null){/* Liste erst beim Start des neuen Durchgangs leeren */}
  if(!S.quiz){ /* Intro */
    main.append(el('div',{class:'card stack'},
      el('h1',{},T('quizTitle')),el('p',{},T('quizIntro')),
      el('button',{class:'btn big block',onclick:()=>{S.quiz=newQuiz();go('quiz',{repeatList:null});}},T('quizStart'),el('span',{html:ICON.next})),
      el('button',{class:'btn ghost',onclick:()=>go('seg',{segIdx:SEG_TOTAL-1})},el('span',{html:ICON.back}),T('back'))));
    return;
  }
  if(S.quiz.done){go('quizResult');return;}
  const cq=currentQuestion();if(!cq){finishQuiz();return;}
  const {a,def}=cq;const q=S.quiz;
  const gesamt=S.quizTotal||q.queue.length;
  const richtig=(S.correctGroups||[]).length;
  const score=el('div',{class:'score'},Array.from({length:gesamt},(_,k)=>el('i',{class:k<richtig?'hit':''})),el('span',{class:'small muted',style:'margin-left:6px'},T('correctSoFar',{n:richtig,total:gesamt})));
  const head=el('div',{class:'row between'},el('h2',{style:'margin:0'},T('quizTitle')+' · '+T('questionOf',{n:q.pos+1})),score);
  const answers=el('div',{class:'answers'});
  const fb=el('div',{class:'feedback',hidden:true});
  const nextBtn=el('button',{class:'btn big block',hidden:true,onclick:()=>{q.pos++;save();if(q.pos>=q.queue.length)finishQuiz();else go('quiz');}},T('next'),el('span',{html:ICON.next}));
  const done=()=>a.chosen!=null&&(a.correct===true||a.tries2===true);
  let picked=done()?null:a.chosen;const btns=[];
  a.order.forEach((ansIdx,k)=>{
    const b=el('button',{class:'answer',onclick:()=>{
      if(a.correct===true||a.tries2)return;                 /* abgeschlossen */
      if(a.chosen!=null&&ansIdx===a.chosen)return;           /* schon als falsch markiert */
      picked=ansIdx;btns.forEach(x=>{if(!x.classList.contains('wrongpick'))x.classList.remove('selected');});b.classList.add('selected');checkBtn.disabled=false;}},
      el('span',{class:'k'},['A','B','C'][k]),el('span',{},def.a[ansIdx]));
    btns.push(b);answers.append(b);
  });
  /* Die richtige Antwort bleibt bei einer falschen Wahl verdeckt. Der Abschnitt läuft noch einmal,
     danach kommt eine andere Variante derselben Frage. So bleibt der Abruf beim Lernenden. */
  /* Erster Fehlversuch: die gewählte Antwort wird markiert, die übrigen bleiben anklickbar.
     Erst der zweite Fehlversuch führt in die Nachschulung. Die richtige Antwort bleibt verdeckt. */
  const showResult=()=>{
    const zweiterVersuchMoeglich = cfg.zweiterVersuch===true && !a.correct && !a.tries2;
    btns.forEach((b,k)=>{const idx=a.order[k];
      if(zweiterVersuchMoeglich){ b.disabled = (idx===a.chosen); if(idx===a.chosen)b.classList.add('wrongpick'); b.classList.remove('selected'); }
      else { b.disabled=true; if(a.correct&&idx===0)b.classList.add('correct'); else if(!a.correct&&(idx===a.chosen||idx===a.chosen1))b.classList.add('wrongpick'); }
    });
    fb.hidden=false;fb.className='feedback '+(a.correct?'ok':'bad');
    fb.replaceChildren(a.correct
      ? (a.secondTry?T('right')+' '+T('secondRight'):T('right'))
      : el('span',{},el('b',{},T('wrong')),
          el('div',{class:'small',style:'margin-top:8px;font-weight:600'}, zweiterVersuchMoeglich?T('tryAgain'):T('wrongWillRepeat'))));
    if(zweiterVersuchMoeglich){ checkBtn.hidden=false; checkBtn.disabled=true; nextBtn.hidden=true; picked=null; }
    else { checkBtn.hidden=true; nextBtn.hidden=false; }
  };
  const checkBtn=el('button',{class:'btn big block',disabled:true,onclick:()=>{
    if(picked==null)return;
    if(a.chosen!=null && a.correct===false && !a.tries2){ /* zweiter Versuch */
      a.chosen1=a.chosen; a.tries2=true; a.chosen=picked; a.correct=picked===0; a.secondTry=a.correct;
    } else if(a.chosen==null){
      a.chosen=picked; a.correct=picked===0;
    } else return;
    if(a.correct){q.correct++;S.correctGroups=[...new Set([...(S.correctGroups||[]),a.group])];}
    save();
    if(a.correct||a.tries2){render();}else{showResult();}
  }},T('check'));
  main.append(el('div',{class:'card stack'},head,el('p',{class:'seg-text',style:'font-weight:600'},def.q),answers,fb,checkBtn,nextBtn));
  if(done()) showResult();   /* Stand nach einem Neuladen wiederherstellen */
}

async function createProof(sigData){

  /* Erste Runde ist die Diagnose, spätere Runden belegen die Nachschulung. */

  const runde1=alleFragen.filter(f=>f.runde===1);

    retrained:[...new Set(alleFragen.filter(f=>!f.correct).map(f=>MOD.groupSegment[f.id.split('-')[0]]).filter(Boolean))],
    passed:S.quiz.passed,themen:(S.quizTotal||runde1.length),nachSchulung:runde1.filter(f=>!f.correct).length,
    openQuestions:S.questions,questionsPending:S.questions.some(q=>q.kind!=='inhalt'),responsible:cfg.responsible||'',statement:S.questions.some(q=>q.kind!=='inhalt')?'received':'received_understood',app:'jetztVerstehstDu PWA '+APP_VERSION};
  rec.hash=await sha256(JSON.stringify(rec)+sigData);
  rec.signature=sigData;

        : el('div',{class:'feedback retry'},el('b',{},T('sendQueued')),T('sendQueuedHint'),
            el('button',{class:'btn secondary block',style:'margin-top:10px',onclick:async e=>{e.currentTarget.disabled=true;await queueSenden();render();}},T('sendRetry'))))
    : el('div',{class:'notice'},el('b',{},T('sendNoEndpoint')),el('div',{class:'small',style:'margin-top:4px'},T('sendNoEndpointHint')));
  const zielZeile=el('div',{class:'small muted',style:'margin-top:-4px'},T('sendTarget',{mail:cfg.mail||'francoiswolf.fw@googlemail.com'}));
  const notfall=el('div',{hidden:!(cfg.endpoint&&!r.deliveredAt&&inWarteschlange)},
    el('button',{class:'btn secondary block',onclick:()=>{jsonBtn.click();setTimeout(()=>{wipe();toast(T('wiped'));go('lang');},900);}},T('wipeAfterSave')),
    el('div',{class:'small muted',style:'margin-top:4px'},T('wipeAfterSaveHint')));
  const actions=el('div',{class:'card stack no-print'},
    statusFeld,
    zielZeile,
    cfg.endpoint?null:el('p',{class:'small muted'},cfg.mail?T('sentHint',{mail:cfg.mail,company:r.customer}):''),
    cfg.endpoint?null:mailLink,
    cfg.endpoint?null:(r.sentAt?el('div',{class:'feedback ok'},'✓ '+T('iSent')+' · '+fmtDate(new Date(r.sentAt),lang)):sentBtn),
    el('div',{class:'row'},
      el('button',{class:'btn secondary grow',onclick:()=>window.print()},el('span',{html:ICON.pdf}),T('savePdf')),
      jsonBtn,
      navigator.share?el('button',{class:'btn secondary grow',onclick:()=>navigator.share({title:subject,text:mailBody}).catch(()=>{})},el('span',{html:ICON.share}),T('share')):null),
    (MOD_IDS.length>1&&Object.keys(S.doneModules||{}).length+1<MOD_IDS.length)
      ? el('button',{class:'btn block',onclick:()=>{S.doneModules=S.doneModules||{};S.doneModules[MOD.id]=true;S.module=null;S.proof=null;S.seen={};S.quiz=null;S.questions=[];save();go('modules');}},T('nextModule'),el('span',{html:ICON.next}))
      : null,
    el('button',{class:'btn block',style:'background:var(--text);color:var(--bg)',onclick:async ()=>{
      if(cfg.endpoint&&!S.proof.deliveredAt){await queueSenden();
        if(!S.proof.deliveredAt){toast(T('wipeBlocked'));notfall.hidden=false;render();return;}}
      wipe();toast(T('wiped'));go('lang');}},T('done')),
    notfall);
  main.append(proof,actions);
}

/* ── 7 Einrichtung (Firma / Gerät) ───────────────────────────────────── */
async function checkPin(){
  if(!cfg.pinHash) return true;
  const v=prompt('PIN der Einrichtung');if(v==null)return false;
  return (await sha256('vd-pin:'+v.trim()))===cfg.pinHash;
}
function vSetup(main){
  const f=(id,label,val,hint,type='text')=>el('div',{class:'field'},el('label',{for:'c_'+id},label),el('input',{class:'input',id:'c_'+id,value:val||'',type}),hint?el('div',{class:'hint'},hint):null);
  const langChecks=Object.keys(LANGS).map(k=>el('label',{class:'check',style:'padding:6px 0'},el('input',{type:'checkbox',id:'l_'+k,checked:cfg.langs.includes(k)}),el('span',{},`${LANGS[k].name} (${k.toUpperCase()})`,LANGS[k].checked?'':el('span',{class:'muted small'},' · ungeprüft'))));
  const link=()=>{const u=new URL(location.href.split('#')[0].split('?')[0]);u.searchParams.set('kunde',cfg.customer);if(cfg.mail)u.searchParams.set('mail',cfg.mail);if(cfg.videoBase)u.searchParams.set('video',cfg.videoBase);u.searchParams.set('langs',cfg.langs.join(','));return u.toString();};
  const linkBox=el('div',{class:'kv'},link());
  main.append(el('div',{class:'card stack'},
    el('h1',{},'Einrichtung'),
    el('p',{class:'muted'},'Diese Einstellungen gelten für dieses Gerät. Für Firmen-Tablets einmal eintragen und mit PIN sichern. Der QR-Link richtet nur Geräte ohne PIN ein.'),
    el('div',{class:'small muted'},'App-Version '+APP_VERSION),
    f('customer','Unternehmen (Kunde)',cfg.customer),
    f('mail','E-Mail-Postfach für Nachweise',cfg.mail,'Dort landet der Nachweis. Ohne Adresse öffnet sich die Mail leer.','email'),
    el('label',{class:'check',style:'padding:8px 0'},
      el('input',{type:'checkbox',id:'c_demo',checked:cfg.demoBilder!==false}),
      el('span',{},'Bilder als Beispiel kennzeichnen',
        el('div',{class:'hint',style:'margin:2px 0 0'},'Legt ein Band über die Fotos: hier stehen später Ihre eigenen Aufnahmen. Abschalten, sobald echte Bilder aus dem Betrieb hinterlegt sind.'))),
    f('endpoint','Endpunkt für den automatischen Versand',cfg.endpoint,'Adresse des Webhooks oder des Google-Apps-Script-Dienstes. Ist sie eingetragen, geht der Nachweis von selbst dorthin und wartet bei fehlendem Netz in der Schlange.','url'),
    f('responsible','Verantwortliche Person',cfg.responsible,'Name der Person, die Rückfragen der Mitarbeiter klärt. Erscheint in der App und im Nachweis.'),
    f('videoBase','Video-Basis-URL',cfg.videoBase,'Optional. Erwartet Dateien wie BA09_S01_DE.mp4 unter dieser Adresse. Leer = Textkarten.'),
    f('pin','PIN für diese Einrichtung',cfg.pinHash?'••••':'', cfg.pinHash?'Gesetzt. Neue PIN eintragen, um sie zu ändern. Mit PIN nimmt das Gerät keine Einrichtung mehr über QR-Links an.':'Mindestens vier Zeichen. Schützt Postfach und Einstellungen vor Änderungen durch Dritte.','password'),
    el('div',{class:'field'},el('label',{},'Sprachen anbieten'),...langChecks),
    el('div',{class:'field'},el('label',{},'Link für QR-Code'),linkBox),
    el('div',{class:'row'},
      el('button',{class:'btn',onclick:async()=>{
        const mail=$('#c_mail').value.trim();const pin=$('#c_pin').value;
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){toast('Bitte ein gültiges E-Mail-Postfach eintragen.');$('#c_mail').focus();return;}
        if(!cfg.pinHash && pin.trim().length<4){toast('Bitte eine PIN mit mindestens vier Zeichen setzen.');$('#c_pin').focus();return;}
        if(pin && pin!=='••••'){if(pin.trim().length<4){toast('PIN: mindestens vier Zeichen.');return;}cfg.pinHash=await sha256('vd-pin:'+pin.trim());}
        cfg.customer=$('#c_customer').value.trim()||DEFAULT_CFG.customer;cfg.mail=mail;cfg.endpoint=$('#c_endpoint').value.trim();cfg.demoBilder=$('#c_demo').checked;cfg.responsible=$('#c_responsible').value.trim();cfg.videoBase=$('#c_videoBase').value.trim();cfg.langs=Object.keys(LANGS).filter(k=>$('#l_'+k).checked);if(!cfg.langs.length)cfg.langs=['de'];
        saveJSON(CFG_KEY,cfg);linkBox.textContent=link();toast('Gespeichert. Einrichtung ist mit PIN geschützt.');}},'Speichern'),
      el('button',{class:'btn secondary',onclick:()=>{history.replaceState(null,'',location.pathname+location.search);go('lang');}},'Zur App'),
      el('button',{class:'btn ghost',onclick:()=>{if(confirm('Laufende Unterweisung auf diesem Gerät verwerfen?')){wipe();toast('Zurückgesetzt.');}}},'Laufende Unterweisung verwerfen'))));
}

/* ═══════════════════════════ PWA ════════════════════════════════════ */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.screen==='lang')render();});
function installApp(){if(!installEvt)return;installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});}
if('serviceWorker'in navigator && !window.VD_SINGLE && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&!navigator.serviceWorker.controller)toast(T('offlineReady'));});});}).catch(()=>{});
}
/* Wortmarke: 5× tippen öffnet die Einrichtung */
let taps=0,tapT;$('#wordmark').addEventListener('click',e=>{e.preventDefault();taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;checkPin().then(ok=>{if(ok)go('setup');else toast('PIN stimmt leider nicht.');});}else if(taps===1&&S.screen!=='setup'){/* einfacher Tipp: nichts */}});
window.addEventListener('hashchange',()=>{if(location.hash==='#setup')checkPin().then(ok=>{if(ok)go('setup');else{toast('PIN stimmt leider nicht.');history.replaceState(null,'',location.pathname+location.search);}});});
render();
})();
